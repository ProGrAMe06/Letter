<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For My Babyy ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
color:#fff;
background:radial-gradient(circle at top,#1f2b5c,#0d1026 55%,#05060f);
overflow-x:hidden;
}
body:before{
content:"";
position:fixed;inset:0;
background:
radial-gradient(2px 2px at 10% 20%,#fff,transparent),
radial-gradient(1.5px 1.5px at 30% 70%,#fff,transparent),
radial-gradient(2px 2px at 80% 15%,#fff,transparent),
radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent),
radial-gradient(2px 2px at 50% 35%,#fff,transparent),
radial-gradient(1.5px 1.5px at 90% 80%,#fff,transparent);
opacity:.8;
animation:twinkle 5s infinite alternate;
pointer-events:none;
}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
h1{font-family:"Great Vibes",cursive;font-size:78px;text-shadow:0 0 18px rgba(255,255,255,.5)}
.hero p{margin:20px 0 35px;font-size:22px;color:#f8f8ff}
button{padding:16px 38px;border:none;border-radius:40px;background:#ff5d8f;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 0 20px rgba(255,93,143,.5);transition:.3s}
button:hover{transform:scale(1.08)}
#letter{display:none;max-width:900px;margin:auto;padding:60px 25px}
.paper{
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.18);
border-radius:24px;
padding:50px;
line-height:2;
font-size:20px;
color:#fffaf0;
box-shadow:0 0 35px rgba(255,255,255,.08);
}
.signature{margin-top:40px;text-align:right;font-family:"Great Vibes",cursive;font-size:48px;color:#ffd6e7}
.heart{position:fixed;top:-20px;color:#ff80ab;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh)}}
.typewriter{white-space:pre-wrap}
</style>
</head>
<body>
<div class="hero" id="home">
<h1>For My Babyy ❤️</h1>
<p>Put on your earphones... this is just for you.</p>
<button onclick="openLetter()">Open My Letter 💌</button>
</div>

<section id="letter">
<div class="paper">
<div id="text" class="typewriter"></div>
<div class="signature" id="signature" style="display:none;">Forever Yours,<br>Vansh ❤️</div>
</div>
</section>

<audio id="bgMusic" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<script>
const message=`Dear Keshuu,

If you're reading this, it means you finally pressed the button... and that already made me smile.

I don't know if words can ever truly explain how much you mean to me, but today I wanted to try.

You make ordinary days feel special.
You make me laugh when I least expect it.
You make me feel understood, supported, and loved.

Thank you for every conversation,
every smile,
every memory,
and every little moment we've shared.

Sometimes I catch myself smiling for no reason...
and then I realize I was thinking about you.

No matter where life takes us,
I hope we continue making memories together—the kind we'll laugh about years from now.

You're one of the best things that has ever happened to me.

If I had one wish,
it would simply be to keep seeing your smile.

Thank you for being you.

I love you more than words can ever say.

Forever yours ❤️`;

function typeWriter(t,i=0){
 if(i<t.length){
  document.getElementById("text").innerHTML += t.charAt(i);
  setTimeout(()=>typeWriter(t,i+1),28);
 } else {
  document.getElementById("signature").style.display = "block";
 }
}
function openLetter(){
 document.getElementById("home").style.display="none";
 document.getElementById("letter").style.display="block";
 let m=document.getElementById("bgMusic");
 m.volume=.35;
 m.play().catch(()=>{});
 typeWriter(message);
}
function createHeart(){
 const h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤";
 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(16+Math.random()*22)+"px";
 h.style.animationDuration=(5+Math.random()*5)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),10000);
}
setInterval(createHeart,250);
</script>
</body>
</html>
